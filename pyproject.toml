[project]
name = "dartsnut-widget-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "chess==1.11.2",
  "pillow==12.1.1",
]

[project.optional-dependencies]
dev = [
  "mypy",
  "ruff",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py311"
line-length = 130
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["tools/dartsnut"]
