[project]
name = "pixeldarts-chess-128-160"
version = "1.0.1"
requires-python = ">=3.11"
dependencies = [
  "chess==1.11.2",
  "pillow==12.3.0",
  "pydartsnut==1.2.1",
]

[tool.uv]
package = false

[tool.dartsnut]
include = [
  "assets/*.png",
  "assets.py",
  "chess_logic/*.py",
  "conf.json",
  "engine_client.py",
  "frame_pump.py",
  "input_adapter.py",
  "main.py",
  "match.py",
  "minigame/*.py",
  "pyproject.toml",
  "rendering.py",
  "uv.lock",
]
