name: Stockfish Evaluator Image

on:
  push:
    branches: [main]
    paths:
      - "services/stockfish_evaluator/**"
      - ".github/workflows/stockfish-evaluator-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: services/stockfish_evaluator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/feocco/dartsnut-widgets-stockfish-evaluator:latest
            ghcr.io/feocco/dartsnut-widgets-stockfish-evaluator:${{ github.sha }}
